[package]
name = "alfred_convert"
version = "1.2.7"
edition = "2024"
rust-version = "1.88"
description = "Convert currencies and physical units with Alfred."
license = "MIT"
publish = false

[dependencies]
alfred_workflow_rs = "1.0.1"
anyhow = "1.0"
jiff = { version = "0.2", features = ["serde"] }
numbat = { version = "1.23.0", default-features = false }
quick-xml = "0.42"
rayon = "1.12"
rmpv = { version = "1.3", features = ["with-serde"] }
rust_decimal = { version = "1.42", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.4.0", features = ["platform-verifier"] }
url = "2.5"

[dev-dependencies]
flate2 = "1.1"
tempfile = "3.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
