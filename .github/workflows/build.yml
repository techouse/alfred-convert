name: Build package

on:
  workflow_call:
    inputs:
      arm64-deployment-target:
        type: string
        required: false
        default: '11.0'
      x86_64-deployment-target:
        type: string
        required: false
        default: '10.15'

defaults:
  run:
    shell: bash
permissions: read-all

jobs:
  build:
    name: Build signed universal workflow
    runs-on: macos-latest
    environment: build
    steps:
      - uses: actions/checkout@v7
      - name: Configure signing paths
        run: |
          set -euo pipefail
          echo "CERTIFICATE_PATH=${RUNNER_TEMP}/build_certificate.p12" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=${RUNNER_TEMP}/app-signing.keychain-db" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Verify release version
        run: |
          set -euo pipefail
          ./scripts/version-check.sh "$GITHUB_REF_NAME"
          VERSION=$(awk '/^\[package\]$/ { p = 1; next } p && /^\[/ { exit } p && /^version = / { gsub(/["[:space:]]/, "", $3); print $3; exit }' Cargo.toml)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build Apple Silicon slice
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ inputs['arm64-deployment-target'] }}
        run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Build Intel slice
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ inputs['x86_64-deployment-target'] }}
        run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Create universal binary
        run: |
          set -euo pipefail
          mkdir -p target/universal-apple-darwin/release
          lipo -create target/aarch64-apple-darwin/release/alfred_convert target/x86_64-apple-darwin/release/alfred_convert -output target/universal-apple-darwin/release/workflow
          chmod 755 target/universal-apple-darwin/release/workflow
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-about }
      - name: Package release workflow
        run: ./scripts/package-workflow.sh target/universal-apple-darwin/release/workflow
      - name: Verify packaged workflow
        env:
          ARM64_DEPLOYMENT_TARGET: ${{ inputs['arm64-deployment-target'] }}
          X86_64_DEPLOYMENT_TARGET: ${{ inputs['x86_64-deployment-target'] }}
        run: |
          set -euo pipefail
          test "$(/usr/libexec/PlistBuddy -c 'Print :version' build/dist/info.plist)" = "$VERSION"
          for required_file in workflow info.plist LICENSE README.md alfredhatcog.png google.png icon.png THIRD_PARTY_LICENSES.html; do test -f "build/dist/$required_file"; done
          if grep -q workflow_intel build/dist/info.plist; then
            echo "Packaged info.plist still references workflow_intel" >&2
            exit 1
          fi
          lipo -info build/dist/workflow | grep -q arm64
          lipo -info build/dist/workflow | grep -q x86_64
          xcrun vtool -arch arm64 -show-build build/dist/workflow | grep -Eq "minos[[:space:]]+$ARM64_DEPLOYMENT_TARGET([.]0)?$"
          xcrun vtool -arch x86_64 -show-build build/dist/workflow | grep -Eq "minos[[:space:]]+$X86_64_DEPLOYMENT_TARGET([.]0)?$"
          SMOKE_DIR=$(mktemp -d "${RUNNER_TEMP}/convert-smoke.XXXXXX")
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          cp -R build/dist/. "$SMOKE_DIR/"
          (cd "$SMOKE_DIR" && ./workflow -q '2in to cm' > smoke.json 2> smoke.stderr && jq -e '.items[] | select((.title // "") | contains("5.08 cm")) | select((.arg // "") | startswith("https://www.wolframalpha.com/"))' smoke.json >/dev/null)
          test ! -e build/dist/.env
          test ! -e build/dist/exchange_rates_cache
          test ! -e build/dist/image_cache
          test ! -e build/dist/update_cache
          test -z "$(find build/dist -maxdepth 1 -name '*_cache_keys.json' -print -quit)"
      - name: Install Apple certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Sign universal binary
        env:
          BUILD_CERTIFICATE_SHA1: ${{ secrets.BUILD_CERTIFICATE_SHA1 }}
        run: |
          set -euo pipefail
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :bundleid' build/dist/info.plist)
          codesign --force --sign "$BUILD_CERTIFICATE_SHA1" --identifier "$BUNDLE_ID" --options runtime --timestamp build/dist/workflow
      - name: Verify signature
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 build/dist/workflow
          test "$(codesign -dv build/dist/workflow 2>&1 | awk -F= '/TeamIdentifier/{print $2}')" = "$TEAM_ID"
      - name: Notarize universal binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARYTOOL_KEYCHAIN_PROFILE: ${{ vars.NOTARYTOOL_KEYCHAIN_PROFILE }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          zip -j build/dist/workflow.zip build/dist/workflow
          xcrun notarytool store-credentials "$NOTARYTOOL_KEYCHAIN_PROFILE" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARYTOOL_PASSWORD" --keychain "$KEYCHAIN_PATH"
          xcrun notarytool submit build/dist/workflow.zip --keychain-profile "$NOTARYTOOL_KEYCHAIN_PROFILE" --keychain "$KEYCHAIN_PATH" --wait
          rm -f build/dist/workflow.zip
      - name: Create Alfred workflow
        env:
          WORKFLOW_NAME: ${{ vars.WORKFLOW_NAME }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="${WORKFLOW_NAME}-v${VERSION}"
          (cd build/dist && zip -qr "../${PACKAGE_NAME}.alfredworkflow.tmp.zip" . -x '.env' 'exchange_rates_cache/*' 'image_cache/*' 'update_cache/*' '*_cache/*' '*_cache_keys.json' 'workflow_intel')
          mv "build/${PACKAGE_NAME}.alfredworkflow.tmp.zip" "build/${PACKAGE_NAME}.alfredworkflow"
          echo "ARTIFACT_NAME=${PACKAGE_NAME}-universal" >> "$GITHUB_ENV"
          echo "ARTIFACT_PATH=build/${PACKAGE_NAME}.alfredworkflow" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 1
      - name: Clean up signing state
        if: ${{ always() }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$CERTIFICATE_PATH"
          rm -rf build
