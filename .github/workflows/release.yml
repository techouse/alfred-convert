name: Release package
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
permissions: read-all
jobs:
  test:
    uses: ./.github/workflows/test.yml
  build:
    needs: test
    uses: ./.github/workflows/build.yml
    secrets: inherit
  github-release:
    needs: build
    environment: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          set -euo pipefail
          ./scripts/version-check.sh "$GITHUB_REF_NAME"
          VERSION=$(awk '/^\[package\]$/ { p = 1; next } p && /^\[/ { exit } p && /^version = / { gsub(/["[:space:]]/, "", $3); print $3; exit }' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          grep -q "## $VERSION" CHANGELOG.md
          CHANGELOG_PATH="$RUNNER_TEMP/CHANGELOG.md"
          awk '/^##[[:space:]].*/ { if (count == 1) exit; count++; print } count == 1 && !/^##[[:space:]].*/ { print }' CHANGELOG.md > "$CHANGELOG_PATH"
          echo "changelog-path=$CHANGELOG_PATH" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ vars.WORKFLOW_NAME }}-v${{ steps.version.outputs.version }}-universal
          path: ${{ runner.temp }}/download
      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.version.outputs.changelog-path }}
          files: ${{ runner.temp }}/download/${{ vars.WORKFLOW_NAME }}-v${{ steps.version.outputs.version }}.alfredworkflow
